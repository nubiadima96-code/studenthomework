<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Кабінет · РЕГІК</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,460;7..72,650&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body { background: #f3efe6; color: #1c1917; }
    body { font-family: Manrope, sans-serif; }
    .font-serif { font-family: Literata, Georgia, serif !important; }
    .book-scroll { position: relative; height: 78vh; min-height: 32rem; overflow: auto; background: #4b4b4b; }
    .book-scroll.is-compact { height: 11rem; min-height: 11rem; cursor: pointer; }
    .book-page { position: relative; margin: 16px auto; background: #fff; }
    .book-hint {
      position: absolute; inset: 0; z-index: 2; display: flex; align-items: center; justify-content: center;
      background: rgba(28, 25, 23, 0.45); color: #fff; font-size: 0.95rem; font-weight: 600; text-align: center;
      padding: 1rem; pointer-events: none;
    }
    .book-frame { position: relative; }
    .teacher-hero {
      display: grid; gap: 1.5rem; align-items: center;
      padding: 1.25rem; border-radius: 1.5rem;
      background:
        radial-gradient(circle at 12% 20%, rgba(6, 95, 70, 0.14), transparent 42%),
        linear-gradient(145deg, #fffdf8 0%, #efe8d8 55%, #e5efe8 100%);
      border: 1px solid rgba(68, 64, 60, 0.14);
    }
    @media (min-width: 768px) {
      .teacher-hero { grid-template-columns: 11rem minmax(0, 1fr); padding: 1.5rem 1.75rem; gap: 1.75rem; }
    }
    .teacher-photo {
      width: 10.5rem; height: 10.5rem; margin: 0 auto; border-radius: 1.25rem;
      object-fit: cover; object-position: center top;
      box-shadow: 0 18px 40px rgba(28, 25, 23, 0.18);
      border: 3px solid #fff;
    }
    @media (min-width: 768px) { .teacher-photo { width: 11rem; height: 11rem; margin: 0; } }
    .subject-card {
      position: relative; overflow: hidden;
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
      box-shadow: 0 10px 28px rgba(28, 25, 23, 0.06);
    }
    .subject-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 34px rgba(28, 25, 23, 0.1);
    }
    .subject-card::before {
      content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px;
      background: linear-gradient(180deg, #065f46, #047857);
    }
    .icon {
      display: inline-flex; width: 1.15rem; height: 1.15rem; flex-shrink: 0;
      color: #065f46;
    }
    .icon svg { width: 100%; height: 100%; display: block; }
    .icon-lg { width: 1.35rem; height: 1.35rem; }
    .book-thumb-card {
      display: flex; align-items: center; gap: 1.1rem; width: 100%;
      padding: 1rem 1.15rem; text-align: left;
      border-radius: 1.25rem; border: 1px solid #d6d3d1; background: #fff;
      transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease;
      box-shadow: 0 8px 24px rgba(28,25,23,.05);
    }
    .book-thumb-card:hover {
      border-color: #065f46; transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(28,25,23,.08);
    }
    .book-screen {
      position: relative; width: 5.4rem; height: 7.1rem; flex-shrink: 0;
      border-radius: 0.7rem; overflow: hidden; background: #3f3f46;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.12), 0 8px 18px rgba(28,25,23,.18);
    }
    .book-screen canvas, .book-screen img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .book-screen-glow {
      position: absolute; inset: auto 0 0 0; height: 42%;
      background: linear-gradient(to top, rgba(6,95,70,.35), transparent);
      pointer-events: none;
    }
    .soft-card {
      border-radius: 1.25rem; border: 1px solid rgba(68,64,60,.12); background: #fff;
      box-shadow: 0 8px 24px rgba(28,25,23,.04);
    }
    .topic-row {
      transition: border-color .15s ease, transform .15s ease, box-shadow .15s ease;
      box-shadow: 0 6px 18px rgba(28,25,23,.04);
    }
    .topic-row:hover {
      transform: translateY(-2px);
      border-color: #065f46;
      box-shadow: 0 12px 26px rgba(28,25,23,.08);
    }
  </style>
</head>
<body class="bg-stone-100 text-stone-900 antialiased">
  <div id="app"></div>
  <script src="vendor/pdf.min.js"></script>
  <script src="config.js?v=3"></script>
  <script src="courses.js?v=2"></script>
  <script src="app.js?v=19"></script>
</body>
</html>
